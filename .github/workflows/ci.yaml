name: ci

concurrency:
  group: capturing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and coverage
        run: make test

  image-arm64:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: turos-arm64-capturing
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/arm64
        run: |
          docker buildx build --builder turos --platform linux/arm64 --push \
            -t "ghcr.io/ferrix/capturing:${{ github.sha }}-arm64" \
            .

  image-amd64:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ferrix/capturing:${{ github.sha }}-amd64

  image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [image-arm64, image-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch tags
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMG=ghcr.io/ferrix/capturing
          tags=(-t "${IMG}:${SHA}")
          if [[ "${REF}" == refs/heads/main ]]; then
            tags+=(-t "${IMG}:latest")
          fi
          if [[ "${REF}" == refs/tags/v* ]]; then
            ver="${REF_NAME#v}"
            tags+=(-t "${IMG}:${ver}" -t "${IMG}:v${ver}")
            IFS=. read -r major minor patch <<<"${ver}"
            tags+=(-t "${IMG}:${major}.${minor}" -t "${IMG}:${major}")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${IMG}:${SHA}-arm64" \
            "${IMG}:${SHA}-amd64"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.rel.outputs.new_release_published }}
      version: ${{ steps.rel.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: cycjimmy/semantic-release-action@v4
        id: rel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git

  image-semver:
    if: needs.release.outputs.published == 'true'
    needs: [release, image-arm64, image-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Tag GHCR with the release version
        env:
          SHA: ${{ github.sha }}
          VER: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          IMG=ghcr.io/ferrix/capturing
          IFS=. read -r major minor patch <<<"${VER}"
          docker buildx imagetools create \
            -t "${IMG}:${VER}" \
            -t "${IMG}:v${VER}" \
            -t "${IMG}:${major}.${minor}" \
            -t "${IMG}:${major}" \
            "${IMG}:${SHA}-arm64" \
            "${IMG}:${SHA}-amd64"
