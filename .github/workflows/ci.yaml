name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and coverage
        run: make test

  image-arm64:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: turos-arm64-capturing
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux/arm64
        run: |
          docker buildx build --builder turos --platform linux/arm64 --push \
            -t "ghcr.io/ferrix/capturing:${{ github.sha }}-arm64" \
            .

  image-amd64:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ferrix/capturing:${{ github.sha }}-amd64

  image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [image-arm64, image-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Create multi-arch tags
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMG=ghcr.io/ferrix/capturing
          tags=(-t "${IMG}:${SHA}")
          if [[ "${REF}" == refs/heads/main ]]; then
            tags+=(-t "${IMG}:latest")
          fi
          if [[ "${REF}" == refs/tags/v* ]]; then
            ver="${REF_NAME#v}"
            tags+=(-t "${IMG}:${ver}" -t "${IMG}:v${ver}")
            IFS=. read -r major minor patch <<<"${ver}"
            tags+=(-t "${IMG}:${major}.${minor}" -t "${IMG}:${major}")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${IMG}:${SHA}-arm64" \
            "${IMG}:${SHA}-amd64"
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes --verify-tag
